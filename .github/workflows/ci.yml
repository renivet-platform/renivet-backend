name: Backend foundation CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run deps:check:syntax
      - run: npm run typecheck
      - run: npm run lint
      - name: Smoke-test installed Drizzle Kit CLI without DB migration
        run: npx --no-install drizzle-kit --version
      - name: Validate checked-in Drizzle config with disposable local generation (no DB access)
        run: |
          npx --no-install drizzle-kit generate --config=./drizzle.config.ts
          test -d "./drizzle/meta"
      - run: npm run build
      - name: Check generated OpenAPI, TypeScript client, and Postman contract artifacts
        run: npm run api:check
      - run: npm test
  postgres-integration:
    name: PostgreSQL 16 disposable integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: renivet_ci
          POSTGRES_USER: renivet_ci
          POSTGRES_PASSWORD: ci_disposable_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U renivet_ci -d renivet_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked project dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply reviewed Drizzle migrations to disposable PostgreSQL 16
        env:
          DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
        run: npx --no-install drizzle-kit migrate --config=./drizzle.config.ts
      - name: Verify migration replay is a safe no-op
        env:
          DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
        run: npx --no-install drizzle-kit migrate --config=./drizzle.config.ts
      - name: Verify REN2-20 identity schema constraints and secret handling
        env:
          RENIVET_TEST_DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
        run: node --test tests/identity-schema.integration.cjs
      - name: Verify REN2-26/28 memberships, effective roles, and append-only access audit
        env:
          RENIVET_TEST_DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
        run: node --test tests/brand-access-schema.integration.cjs
      - name: Verify REN2-27/28 session-derived authorization, live query scope, and T-AZ/T-ID denials
        env:
          RENIVET_TEST_DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
        run: |
          npm run build
          node --test tests/brand-access.integration.test.cjs
      - name: Verify PostgreSQL transaction/unique-key/claim semantics
        env:
          RENIVET_TEST_DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
        run: node --test tests/postgres-foundation.integration.cjs
      - name: Verify REN2-29 outbox, inbox, receipt and job constraints
        env:
          RENIVET_TEST_DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
        run: node --test tests/outbox-inbox.integration.cjs
      - name: Verify REN2-30/31 worker crashes, claims, retry, observability and recovery
        env:
          RENIVET_TEST_DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
        run: |
          npm run build
          node --test --test-reporter=tap tests/durable-worker.integration.cjs | tee ren2-31-worker-before-recovery.tap
      - name: Verify REN2-21 registration and REN2-23/24 session, MFA and Postman examples
        env:
          RENIVET_TEST_DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
          RENIVET_TEST_REDIS_URL: redis://127.0.0.1:6379/15
          RENIVET_TEST_SERVICES_DISPOSABLE: '1'
        run: |
          npm run build
          npm install --global postman-cli@1.80.0 --no-audit --no-fund
          postman --version
          node --test tests/auth-api.integration.test.cjs
      - name: Verify REN2-22 OTP and REN2-23 account recovery/Postman collection
        env:
          RENIVET_TEST_DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
          RENIVET_TEST_REDIS_URL: redis://127.0.0.1:6379/15
          RENIVET_TEST_SERVICES_DISPOSABLE: '1'
          AUTH_CHALLENGE_HMAC_KEY: synthetic-otp-ci-proof-key-not-a-secret-000000000000
          AUTH_RATE_LIMIT_HMAC_KEY: synthetic-otp-ci-rate-key-not-a-secret-000000000000
        run: |
          npm run build
          node --test tests/otp-challenges.integration.test.cjs
      - name: Verify REN2-24/28 MFA enrollment, privileged decisions, replay protection and audit
        env:
          RENIVET_TEST_DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
          RENIVET_TEST_REDIS_URL: redis://127.0.0.1:6379/15
          RENIVET_TEST_SERVICES_DISPOSABLE: '1'
        run: |
          npm run build
          node --test tests/mfa-repository.integration.cjs tests/mfa-api.integration.test.cjs
      - name: Rebuild disposable PostgreSQL 16 from a recovery snapshot
        env:
          RENIVET_TEST_DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
          RENIVET_ALLOW_DISPOSABLE_DATABASE_REBUILD: '1'
        run: node --test tests/identity-schema.recovery.integration.cjs
      - name: Verify migration replay after PostgreSQL recovery
        env:
          DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
        run: npx --no-install drizzle-kit migrate --config=./drizzle.config.ts
      - name: Re-verify identity indexes and constraints after recovery
        env:
          RENIVET_TEST_DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
        run: node --test tests/identity-schema.integration.cjs
      - name: Re-verify REN2-26 membership and access controls after recovery
        env:
          RENIVET_TEST_DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
        run: node --test tests/brand-access-schema.integration.cjs
      - name: Re-verify REN2-27 live brand query scope after recovery
        env:
          RENIVET_TEST_DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
        run: |
          npm run build
          node --test tests/brand-access.integration.test.cjs
      - name: Re-verify REN2-28 privileged action audit and MFA decisions after recovery
        env:
          RENIVET_TEST_DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
          RENIVET_TEST_REDIS_URL: redis://127.0.0.1:6379/15
          RENIVET_TEST_SERVICES_DISPOSABLE: '1'
        run: |
          npm run build
          node --test tests/mfa-guard.test.cjs tests/mfa-api.integration.test.cjs
      - name: Re-verify PostgreSQL transaction/unique-key/claim semantics after recovery
        env:
          RENIVET_TEST_DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
        run: node --test tests/postgres-foundation.integration.cjs
      - name: Re-verify REN2-29 constraints after recovery
        env:
          RENIVET_TEST_DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
        run: node --test tests/outbox-inbox.integration.cjs
      - name: Re-verify REN2-30/31 worker behavior after PostgreSQL recovery
        env:
          RENIVET_TEST_DATABASE_URL: postgresql://renivet_ci:ci_disposable_only@127.0.0.1:5432/renivet_ci
        run: node --test --test-reporter=tap tests/durable-worker.integration.cjs | tee ren2-31-worker-after-recovery.tap
      - name: Preserve REN2-31 worker reliability test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ren2-31-worker-reliability-tap
          path: ren2-31-worker-*.tap
          retention-days: 7
          if-no-files-found: warn
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production image
        run: docker build --tag renivet-backend:ci .
      - name: Reject fixable high/critical container OS and library CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'renivet-backend:ci'
          version: 'v0.70.0'
          format: table
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          vuln-type: 'os,library'
          scanners: vuln
          exit-code: '1'
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
      - name: Create SPDX SBOM for reviewed CI container
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'renivet-backend:ci'
          version: 'v0.70.0'
          format: spdx-json
          output: 'container-sbom.spdx.json'
          scanners: vuln
          exit-code: '0'
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
      - name: Preserve CI container SBOM for release review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renivet-backend-container-sbom
          path: container-sbom.spdx.json
          retention-days: 7
          if-no-files-found: error
      - name: Start isolated staging container with dummy-only config
        run: |
          docker run --detach --name renivet-backend-ci \
            --publish 127.0.0.1:49000:4000 \
            --env NODE_ENV=staging \
            --env HOST=0.0.0.0 \
            --env DATABASE_URL=postgres://ci:dummy@db.invalid:5432/renivet \
            --env REDIS_URL=redis://cache.invalid:6379 \
            --env AUTH_RATE_LIMIT_HMAC_KEY=ci-only-dummy-auth-rate-limit-hmac-key-not-a-secret \
            --env AUTH_CHALLENGE_HMAC_KEY=ci-only-dummy-auth-challenge-hmac-key-not-a-secret \
            --env AUTH_CSRF_HMAC_KEY=ci-only-dummy-auth-csrf-hmac-key-not-a-secret \
            --env AUTH_MFA_ENCRYPTION_KEY=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            --env AUTH_ALLOWED_ORIGINS=https://renivet.example.test \
            --env TYPESENSE_URL=https://search.invalid:8108 \
            --env TYPESENSE_API_KEY=ci-example-not-a-secret \
            --env PYTHON_SERVICE_URL=https://ai.invalid:8000 \
            renivet-backend:ci
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:49000/api/v1/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs renivet-backend-ci
          exit 1
      - name: Verify staging hides Swagger endpoints
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:49000/docs)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:49000/docs-json)" = "404"
      - name: Stop disposable container
        if: always()
        run: docker rm --force renivet-backend-ci || true
