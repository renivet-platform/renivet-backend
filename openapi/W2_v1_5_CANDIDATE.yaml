components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-renivet_session
      description: Exact cookie name read from W1 session.service.ts; Secure __Host- cookie. Session verification
        and CSRF enforced server-side.
  parameters:
    brandId:
      in: path
      name: brandId
      required: true
      schema:
        type: string
        format: uuid
      description: Resolved and verified against session membership; never trust path alone
    productId:
      in: path
      name: productId
      required: true
      schema:
        type: string
        format: uuid
    idempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
    categoryId:
      in: path
      name: categoryId
      required: true
      schema:
        type: string
        format: uuid
    variantId:
      in: path
      name: variantId
      required: true
      schema:
        type: string
        format: uuid
    reviewId:
      in: path
      name: reviewId
      required: true
      schema:
        type: string
        format: uuid
    batchId:
      in: path
      name: batchId
      required: true
      schema:
        type: string
        format: uuid
    locationId:
      in: path
      name: locationId
      required: true
      schema:
        type: string
        format: uuid
    caseId:
      in: path
      name: caseId
      required: true
      schema:
        type: string
        format: uuid
    adjustmentId:
      in: path
      name: adjustmentId
      required: true
      schema:
        type: string
        format: uuid
    ifMatch:
      in: header
      name: If-Match
      required: true
      schema:
        type: string
      description: Expected resource version or signed import preview hash
    cursor:
      in: query
      name: cursor
      schema:
        type: string
    limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    mediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    linkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    priceId:
      name: priceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    version:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    claimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ErrorResponse:
      description: Auth-safe error with request trace
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
    ProductSummary:
      type: object
      required:
      - id
      - brandId
      - styleCode
      - title
      - publicationState
      - contentVersion
      properties:
        id:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
        styleCode:
          type: string
        title:
          type: string
        publicationState:
          type: string
          enum:
          - DRAFT
          - INCOMPLETE
          - PENDING_REVIEW
          - APPROVED
          - PUBLISHED
          - RE_REVIEW
          - REJECTED
          - RESTRICTED
          - ARCHIVED
        contentVersion:
          type: integer
          minimum: 1
    CreateProduct:
      type: object
      required:
      - styleCode
      - categoryCode
      - categorySchemaVersion
      - title
      additionalProperties: false
      properties:
        styleCode:
          type: string
          minLength: 1
        categoryCode:
          type: string
        categorySchemaVersion:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
        description:
          type: string
        attributes:
          type: object
          additionalProperties: true
        variants:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/CreateVariant'
      description: Creates INCOMPLETE/DRAFT parent; variants, price and images are optional until submit.
    CreateVariant:
      type: object
      required:
      - sku
      - options
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[A-Za-z0-9_.-]+$
        options:
          type: object
          additionalProperties:
            type: string
        weightG:
          type: integer
          minimum: 0
      additionalProperties: false
    Price:
      type: object
      required:
      - currency
      - sellingPriceMinor
      - mrpMinor
      properties:
        currency:
          type: string
          const: INR
        sellingPriceMinor:
          type: integer
          minimum: 0
        mrpMinor:
          type: integer
          minimum: 1
    ProductCreated:
      type: object
      required:
      - productId
      - publicationState
      - contentVersion
      - qcState
      - categorySchemaVersion
      properties:
        productId:
          type: string
          format: uuid
        publicationState:
          type: string
          const: DRAFT
        contentVersion:
          type: integer
          const: 1
        rowVersion:
          type: integer
          const: 1
        variantIds:
          type: array
          items:
            type: string
            format: uuid
        qcState:
          type: string
          const: NOT_SUBMITTED
        categorySchemaVersion:
          type: integer
          minimum: 1
    CreateImportBatch:
      type: object
      required:
      - sourceKind
      - sourceAsOf
      - fileUploadId
      - mode
      properties:
        sourceKind:
          type: string
          enum:
          - RENIVET_CSV
          - RENIVET_XLSX
          - SHOPIFY_CSV
          - UNIWARE_CSV
          - GENERIC_CSV
        sourceAsOf:
          type: string
          format: date-time
        fileUploadId:
          type: string
          format: uuid
        mode:
          type: string
          enum:
          - CREATE_ONLY
          - UPDATE_MATCHED
          - SKIP_EXISTING
          - REVIEW_CONFLICT
    CreateImportUpload:
      type: object
      additionalProperties: false
      required:
      - sourceKind
      - fileName
      - mimeType
      - byteLength
      - sha256
      properties:
        sourceKind:
          type: string
          enum:
          - RENIVET_CSV
          - RENIVET_XLSX
          - SHOPIFY_CSV
          - UNIWARE_CSV
          - GENERIC_CSV
          - MEDIA_ZIP
        fileName:
          type: string
          minLength: 1
          maxLength: 160
          description: Display name only; storage paths are generated by the server.
        mimeType:
          type: string
          enum:
          - text/csv
          - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          - application/zip
        byteLength:
          type: integer
          minimum: 1
          maximum: 104857600
          description: CSV/XLSX uploads are limited to 10 MiB; MEDIA_ZIP uploads are limited to 100 MiB but remain disabled until activation gates pass.
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
    ImportUploadIntent:
      type: object
      additionalProperties: false
      required:
      - fileUploadId
      - uploadMethod
      - uploadUrl
      - expiresAt
      - headers
      properties:
        fileUploadId:
          type: string
          format: uuid
        uploadMethod:
          type: string
          const: PUT
        uploadUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time
        headers:
          type: object
          additionalProperties:
            type: string
    ImportAccepted:
      type: object
      required:
      - batchId
      - status
      properties:
        batchId:
          type: string
          format: uuid
        status:
          type: string
          const: RECEIVED
    ImportPreview:
      type: object
      required:
      - batchId
      - previewHash
      - rows
      - counts
      properties:
        batchId:
          type: string
          format: uuid
        previewHash:
          type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
    StockBalance:
      type: object
      required:
      - brandId
      - variantId
      - locationId
      - physicalOnHand
      - quarantined
      - otherNonSellable
      - allocatedNotDispatched
      - safetyBuffer
      - availableToPromise
      - balanceVersion
      properties:
        brandId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        physicalOnHand:
          type: integer
          minimum: 0
        quarantined:
          type: integer
          minimum: 0
        otherNonSellable:
          type: integer
          minimum: 0
        allocatedNotDispatched:
          type: integer
          minimum: 0
        safetyBuffer:
          type: integer
          minimum: 0
        availableToPromise:
          type: integer
          minimum: 0
        balanceVersion:
          type: integer
          minimum: 1
        suspended:
          type: boolean
        unit:
          type: string
          const: each
        prePaymentHeld:
          type: integer
          const: 0
        stockFreshnessState:
          type: string
          enum:
          - FRESH
          - STALE
          - SUSPENDED
          - UNKNOWN
    StockObservation:
      type: object
      required:
      - source
      - sourceReference
      - asOf
      - lines
      properties:
        source:
          type: string
          enum:
          - BRAND_PORTAL_COUNT
          - RENIVET_CSV
          - UNIWARE_EXPORT
          - AUTHORIZED_API
          - OPERATIONS_CORRECTION
        sourceReference:
          type: string
        asOf:
          type: string
          format: date-time
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - variantId
            - locationId
            - reportedPhysicalOnHand
            - expectedBalanceVersion
            properties:
              variantId:
                type: string
                format: uuid
              locationId:
                type: string
                format: uuid
              reportedPhysicalOnHand:
                type: integer
                minimum: 0
              expectedBalanceVersion:
                type: integer
                minimum: 1
    ActionReceipt:
      type: object
      required:
      - id
      - status
      - requestId
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        requestId:
          type: string
        rowVersion:
          type: integer
          minimum: 1
    CategorySummary:
      type: object
      required:
      - isLeaf
      - parentId
      - schemaVersion
      - id
      - isActive
      - name
      - currentSchemaVersion
      - code
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        schemaVersion:
          type: integer
          minimum: 1
        parentId:
          type:
          - string
          - 'null'
          format: uuid
        isLeaf:
          type: boolean
        isActive:
          type: boolean
        currentSchemaVersion:
          type: integer
          minimum: 1
        pathCodes:
          type: array
          items:
            type: string
    AttributeDefinition:
      type: object
      required:
      - code
      - scope
      - type
      - required
      properties:
        code:
          type: string
        scope:
          type: string
          enum:
          - PRODUCT
          - VARIANT
        type:
          type: string
          enum:
          - text
          - integer
          - decimal
          - boolean
          - enum
          - multi_enum
          - date
          - measurement
        required:
          type: boolean
        condition:
          type:
          - object
          - 'null'
        allowedValues:
          type: array
          items:
            type: string
        schemaVersionId:
          type: string
          format: uuid
        validatorVersion:
          type: string
        conditionalAst:
          type:
          - object
          - 'null'
        scopeType:
          type: string
          enum:
          - product
          - variant
    VariantCreate:
      $ref: '#/components/schemas/CreateVariant'
    PriceProposal:
      type: object
      additionalProperties: false
      required:
      - currency
      - sellingPriceMinor
      - mrpMinor
      - validFrom
      - ruleVersion
      properties:
        currency:
          type: string
          const: INR
        sellingPriceMinor:
          type: integer
          minimum: 0
        mrpMinor:
          type: integer
          minimum: 1
        validFrom:
          type: string
          format: date-time
        validTo:
          type:
          - string
          - 'null'
          format: date-time
        ruleVersion:
          type: integer
          minimum: 1
        reasonCode:
          type: string
    ReviewDecision:
      type: object
      additionalProperties: false
      required:
      - decision
      - reasonCode
      - expectedRevisionId
      properties:
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
          - CORRECTION_REQUIRED
          - RESTRICTED
        reasonCode:
          type: string
        expectedRevisionId:
          type: string
          format: uuid
        comment:
          type: string
    ReasonedAction:
      type: object
      additionalProperties: false
      required:
      - reasonCode
      properties:
        reasonCode:
          type: string
        comment:
          type: string
    UploadInit:
      type: object
      additionalProperties: false
      required:
      - fileName
      - mimeType
      - byteLength
      - rightsAttested
      properties:
        fileName:
          type: string
        mimeType:
          type: string
        byteLength:
          type: integer
          minimum: 1
        rightsAttested:
          type: boolean
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    MediaZipImportStatus:
      type: object
      additionalProperties: false
      required:
      - id
      - status
      - rowVersion
      - effectCount
      - succeededCount
      - failedCount
      - errorCode
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - QUEUED
          - PROCESSING
          - PARTIAL
          - SUCCEEDED
          - FAILED
        rowVersion:
          type: integer
          minimum: 1
        effectCount:
          type: integer
          minimum: 0
        succeededCount:
          type: integer
          minimum: 0
        failedCount:
          type: integer
          minimum: 0
        errorCode:
          type: string
          nullable: true
    CreateMediaZipMappingManifest:
      type: object
      additionalProperties: false
      required:
      - mappings
      - rightsAttested
      properties:
        mappings:
          type: array
          minItems: 1
          maxItems: 12000
          items:
            type: object
            additionalProperties: false
            required:
            - sku
            - productId
            - variantId
            properties:
              sku:
                type: string
                pattern: '^[A-Za-z0-9_.-]{1,40}$'
              productId:
                type: string
                format: uuid
              variantId:
                type: string
                format: uuid
        rightsAttested:
          type: boolean
          enum:
          - true
    ZipImport:
      type: object
      additionalProperties: false
      required:
      - mappingManifestId
      properties:
        fileUploadId:
          type: string
          format: uuid
        mappingManifestId:
          type: string
          format: uuid
        remoteImages:
          type: array
          minItems: 1
          maxItems: 400
          items:
            type: object
            additionalProperties: false
            required:
            - sku
            - slot
            - url
            properties:
              sku:
                type: string
                pattern: '^[A-Za-z0-9_.-]{1,40}$'
              slot:
                type: integer
                minimum: 1
                maximum: 99
              url:
                type: string
                maxLength: 2048
                pattern: '^https://'
      oneOf:
      - required:
        - fileUploadId
      - required:
        - remoteImages
    ImportMappingReceipt:
      type: object
      additionalProperties: false
      required:
      - mappingVersion
      - previewRevision
      - previewHash
      properties:
        mappingVersion:
          type: integer
          minimum: 1
        previewRevision:
          type: integer
          minimum: 1
        previewHash:
          type: string
          pattern: ^[a-f0-9]{64}$
    ImportMapping:
      type: object
      additionalProperties: false
      required:
      - fieldMappings
      - categoryMappings
      properties:
        fieldMappings:
