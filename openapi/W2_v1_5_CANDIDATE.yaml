components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-renivet_session
      description: Exact cookie name read from W1 session.service.ts; Secure __Host- cookie. Session verification
        and CSRF enforced server-side.
  parameters:
    brandId:
      in: path
      name: brandId
      required: true
      schema:
        type: string
        format: uuid
      description: Resolved and verified against session membership; never trust path alone
    productId:
      in: path
      name: productId
      required: true
      schema:
        type: string
        format: uuid
    idempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 120
    categoryId:
      in: path
      name: categoryId
      required: true
      schema:
        type: string
        format: uuid
    variantId:
      in: path
      name: variantId
      required: true
      schema:
        type: string
        format: uuid
    reviewId:
      in: path
      name: reviewId
      required: true
      schema:
        type: string
        format: uuid
    batchId:
      in: path
      name: batchId
      required: true
      schema:
        type: string
        format: uuid
    locationId:
      in: path
      name: locationId
      required: true
      schema:
        type: string
        format: uuid
    caseId:
      in: path
      name: caseId
      required: true
      schema:
        type: string
        format: uuid
    adjustmentId:
      in: path
      name: adjustmentId
      required: true
      schema:
        type: string
        format: uuid
    ifMatch:
      in: header
      name: If-Match
      required: true
      schema:
        type: string
      description: Expected resource version or signed import preview hash
    cursor:
      in: query
      name: cursor
      schema:
        type: string
    limit:
      in: query
      name: limit
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    mediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    linkId:
      name: linkId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    priceId:
      name: priceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    version:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    claimId:
      name: claimId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    ErrorResponse:
      description: Auth-safe error with request trace
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - code
      - message
      - requestId
      properties:
        code:
          type: string
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
    ProductSummary:
      type: object
      required:
      - id
      - brandId
      - styleCode
      - title
      - publicationState
      - contentVersion
      properties:
        id:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
        styleCode:
          type: string
        title:
          type: string
        publicationState:
          type: string
          enum:
          - DRAFT
          - INCOMPLETE
          - PENDING_REVIEW
          - APPROVED
          - PUBLISHED
          - RE_REVIEW
          - REJECTED
          - RESTRICTED
          - ARCHIVED
        contentVersion:
          type: integer
          minimum: 1
    CreateProduct:
      type: object
      required:
      - styleCode
      - categoryCode
      - categorySchemaVersion
      - title
      additionalProperties: false
      properties:
        styleCode:
          type: string
          minLength: 1
        categoryCode:
          type: string
        categorySchemaVersion:
          type: integer
          minimum: 1
        title:
          type: string
          minLength: 1
        description:
          type: string
        attributes:
          type: object
          additionalProperties: true
        variants:
          type: array
          minItems: 0
          items:
            $ref: '#/components/schemas/CreateVariant'
      description: Creates INCOMPLETE/DRAFT parent; variants, price and images are optional until submit.
    CreateVariant:
      type: object
      required:
      - sku
      - options
      properties:
        sku:
          type: string
          minLength: 1
          maxLength: 40
          pattern: ^[A-Za-z0-9_.-]+$
        options:
          type: object
          additionalProperties:
            type: string
        weightG:
          type: integer
          minimum: 0
      additionalProperties: false
    Price:
      type: object
      required:
      - currency
      - sellingPriceMinor
      - mrpMinor
      properties:
        currency:
          type: string
          const: INR
        sellingPriceMinor:
          type: integer
          minimum: 0
        mrpMinor:
          type: integer
          minimum: 1
    ProductCreated:
      type: object
      required:
      - productId
      - publicationState
      - contentVersion
      - qcState
      - categorySchemaVersion
      properties:
        productId:
          type: string
          format: uuid
        publicationState:
          type: string
          const: DRAFT
        contentVersion:
          type: integer
          const: 1
        rowVersion:
          type: integer
          const: 1
        variantIds:
          type: array
          items:
            type: string
            format: uuid
        qcState:
          type: string
          const: NOT_SUBMITTED
        categorySchemaVersion:
          type: integer
          minimum: 1
    CreateImportBatch:
      type: object
      required:
      - sourceKind
      - sourceAsOf
      - fileUploadId
      - mode
      properties:
        sourceKind:
          type: string
          enum:
          - RENIVET_CSV
          - RENIVET_XLSX
          - SHOPIFY_CSV
          - UNIWARE_CSV
          - GENERIC_CSV
        sourceAsOf:
          type: string
          format: date-time
        fileUploadId:
          type: string
          format: uuid
        mode:
          type: string
          enum:
          - CREATE_ONLY
          - UPDATE_MATCHED
          - SKIP_EXISTING
          - REVIEW_CONFLICT
    ImportAccepted:
      type: object
      required:
      - batchId
      - status
      properties:
        batchId:
          type: string
          format: uuid
        status:
          type: string
          const: RECEIVED
    ImportPreview:
      type: object
      required:
      - batchId
      - previewHash
      - rows
      - counts
      properties:
        batchId:
          type: string
          format: uuid
        previewHash:
          type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        counts:
          type: object
          additionalProperties:
            type: integer
            minimum: 0
    StockBalance:
      type: object
      required:
      - brandId
      - variantId
      - locationId
      - physicalOnHand
      - quarantined
      - otherNonSellable
      - allocatedNotDispatched
      - safetyBuffer
      - availableToPromise
      - balanceVersion
      properties:
        brandId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        physicalOnHand:
          type: integer
          minimum: 0
        quarantined:
          type: integer
          minimum: 0
        otherNonSellable:
          type: integer
          minimum: 0
        allocatedNotDispatched:
          type: integer
          minimum: 0
        safetyBuffer:
          type: integer
          minimum: 0
        availableToPromise:
          type: integer
          minimum: 0
        balanceVersion:
          type: integer
          minimum: 1
        suspended:
          type: boolean
        unit:
          type: string
          const: each
        prePaymentHeld:
          type: integer
          const: 0
        stockFreshnessState:
          type: string
          enum:
          - FRESH
          - STALE
          - SUSPENDED
          - UNKNOWN
    StockObservation:
      type: object
      required:
      - source
      - sourceReference
      - asOf
      - lines
      properties:
        source:
          type: string
          enum:
          - BRAND_PORTAL_COUNT
          - RENIVET_CSV
          - UNIWARE_EXPORT
          - AUTHORIZED_API
          - OPERATIONS_CORRECTION
        sourceReference:
          type: string
        asOf:
          type: string
          format: date-time
        lines:
          type: array
          minItems: 1
          items:
            type: object
            required:
            - variantId
            - locationId
            - reportedPhysicalOnHand
            - expectedBalanceVersion
            properties:
              variantId:
                type: string
                format: uuid
              locationId:
                type: string
                format: uuid
              reportedPhysicalOnHand:
                type: integer
                minimum: 0
              expectedBalanceVersion:
                type: integer
                minimum: 1
    ActionReceipt:
      type: object
      required:
      - id
      - status
      - requestId
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
        requestId:
          type: string
        rowVersion:
          type: integer
          minimum: 1
    CategorySummary:
      type: object
      required:
      - isLeaf
      - parentId
      - schemaVersion
      - id
      - isActive
      - name
      - currentSchemaVersion
      - code
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        schemaVersion:
          type: integer
          minimum: 1
        parentId:
          type:
          - string
          - 'null'
          format: uuid
        isLeaf:
          type: boolean
        isActive:
          type: boolean
        currentSchemaVersion:
          type: integer
          minimum: 1
        pathCodes:
          type: array
          items:
            type: string
    AttributeDefinition:
      type: object
      required:
      - code
      - scope
      - type
      - required
      properties:
        code:
          type: string
        scope:
          type: string
          enum:
          - PRODUCT
          - VARIANT
        type:
          type: string
          enum:
          - text
          - integer
          - decimal
          - boolean
          - enum
          - multi_enum
          - date
          - measurement
        required:
          type: boolean
        condition:
          type:
          - object
          - 'null'
        allowedValues:
          type: array
          items:
            type: string
        schemaVersionId:
          type: string
          format: uuid
        validatorVersion:
          type: string
        conditionalAst:
          type:
          - object
          - 'null'
        scopeType:
          type: string
          enum:
          - product
          - variant
    VariantCreate:
      $ref: '#/components/schemas/CreateVariant'
    PriceProposal:
      type: object
      additionalProperties: false
      required:
      - currency
      - sellingPriceMinor
      - mrpMinor
      - validFrom
      - ruleVersion
      properties:
        currency:
          type: string
          const: INR
        sellingPriceMinor:
          type: integer
          minimum: 0
        mrpMinor:
          type: integer
          minimum: 1
        validFrom:
          type: string
          format: date-time
        validTo:
          type:
          - string
          - 'null'
          format: date-time
        ruleVersion:
          type: integer
          minimum: 1
        reasonCode:
          type: string
    ReviewDecision:
      type: object
      additionalProperties: false
      required:
      - decision
      - reasonCode
      - expectedRevisionId
      properties:
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
          - CORRECTION_REQUIRED
          - RESTRICTED
        reasonCode:
          type: string
        expectedRevisionId:
          type: string
          format: uuid
        comment:
          type: string
    ReasonedAction:
      type: object
      additionalProperties: false
      required:
      - reasonCode
      properties:
        reasonCode:
          type: string
        comment:
          type: string
    UploadInit:
      type: object
      additionalProperties: false
      required:
      - fileName
      - mimeType
      - byteLength
      - rightsAttested
      properties:
        fileName:
          type: string
        mimeType:
          type: string
        byteLength:
          type: integer
          minimum: 1
        rightsAttested:
          type: boolean
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    ZipImport:
      type: object
      additionalProperties: false
      required:
      - fileUploadId
      - mappingManifestId
      properties:
        fileUploadId:
          type: string
          format: uuid
        mappingManifestId:
          type: string
          format: uuid
        retryMode:
          type: string
          enum:
          - ALL
          - FAILED_ONLY
    ImportMapping:
      type: object
      additionalProperties: false
      required:
      - sourceSchemaVersion
      - mappings
      - expectedBatchVersion
      properties:
        sourceSchemaVersion:
          type: string
        mappings:
          type: object
          additionalProperties:
            type: string
        expectedBatchVersion:
          type: integer
          minimum: 1
    ImportConfirm:
      type: object
      additionalProperties: false
      required:
      - previewHash
      - previewRevision
      - allowPartial
      properties:
        previewHash:
          type: string
          pattern: ^[0-9a-f]{64}$
        previewRevision:
          type: integer
          minimum: 1
        allowPartial:
          type: boolean
    RetryRequest:
      type: object
      additionalProperties: false
      required:
      - mode
      properties:
        mode:
          type: string
          const: FAILED_ONLY
        errorCodes:
          type: array
          items:
            type: string
    StockLocationCreate:
      type: object
      additionalProperties: false
      required:
      - locationCode
      - name
      properties:
        locationCode:
          type: string
        name:
          type: string
    StockAdjustmentProposal:
      type: object
      additionalProperties: false
      required:
      - variantId
      - locationId
      - deltaPhysical
      - expectedBalanceVersion
      - reasonCode
      properties:
        variantId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        deltaPhysical:
          type: integer
        expectedBalanceVersion:
          type: integer
          minimum: 1
        reasonCode:
          type: string
        evidenceRef:
          type: string
    StockAdjustmentDecision:
      type: object
      additionalProperties: false
      required:
      - decision
      - reasonCode
      properties:
        decision:
          type: string
          enum:
          - APPROVED
          - REJECTED
        reasonCode:
          type: string
    CycleCountCreate:
      type: object
      additionalProperties: false
      required:
      - variantId
      - locationId
      - reportedPhysical
      - expectedBalanceVersion
      properties:
        variantId:
          type: string
          format: uuid
        locationId:
          type: string
          format: uuid
        reportedPhysical:
          type: integer
          minimum: 0
        expectedBalanceVersion:
          type: integer
          minimum: 1
    ReconciliationResolution:
      type: object
      additionalProperties: false
      required:
      - decision
      - reasonCode
      - expectedCaseVersion
      properties:
        decision:
          type: string
          enum:
          - DISMISS
          - COMPENSATE
        reasonCode:
          type: string
        expectedCaseVersion:
          type: integer
          minimum: 1
        approvedAdjustmentId:
          type: string
          format: uuid
    ProductPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
        description:
          type: string
        categorySchemaVersion:
          type: integer
          minimum: 1
        attributes:
          type: object
          additionalProperties: true
    ImportResults:
      type: object
      required:
      - batchId
      - items
      properties:
        batchId:
          type: string
          format: uuid
        items:
          type: array
          items:
            type: object
            properties:
              rowNumber:
                type: integer
              status:
                type: string
              errorCodes:
                type: array
                items:
                  type: string
              effectReceiptId:
                type: string
                format: uuid
        nextCursor:
          type:
          - string
          - 'null'
    MovementSummary:
      type: object
      required:
      - id
      - reason
      - deltaPhysical
      - recordedAt
      properties:
        id:
          type: string
          format: uuid
        reason:
          type: string
        deltaPhysical:
          type: integer
        recordedAt:
          type: string
          format: date-time
    ReconciliationCase:
      type: object
      required:
      - id
      - state
      - reasonCode
      properties:
        id:
          type: string
          format: uuid
        state:
          type: string
        reasonCode:
          type: string
    PagedCategories:
      type: object
      required:
      - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CategorySummary'
        nextCursor:
          type:
          - string
          - 'null'
    PagedProducts:
      type: object
      required:
      - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ProductSummary'
        nextCursor:
          type:
          - string
          - 'null'
    PagedMovements:
      type: object
      required:
      - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/MovementSummary'
        nextCursor:
          type:
          - string
          - 'null'
    PagedStockBalances:
      type: object
      required:
      - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StockBalance'
        nextCursor:
          type:
          - string
          - 'null'
    PagedReconciliations:
      type: object
      required:
      - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationCase'
        nextCursor:
          type:
          - string
          - 'null'
    PagedAttributeDefinitions:
      type: object
      required:
      - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDefinition'
        nextCursor:
          type:
          - string
          - 'null'
    CategorySchemaVersion:
      type: object
      additionalProperties: false
      required:
      - categoryId
      - version
      - state
      - validatorVersion
      - rulesetSha256
      - attributes
      properties:
        categoryId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
          - DRAFT
          - PUBLISHED
        validatorVersion:
          type: string
        rulesetSha256:
          type: string
          pattern: ^[0-9a-f]{64}$
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDefinition'
    VariantDetail:
      type: object
      required:
      - id
      - productId
      - brandId
      - sku
      - options
      - variantState
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        brandId:
          type: string
          format: uuid
        sku:
          type: string
        options:
          type: object
          additionalProperties:
            type: string
        variantState:
          type: string
        priceVersions:
          type: array
          items:
            $ref: '#/components/schemas/PriceVersion'
        mediaLinks:
          type: array
          items:
            $ref: '#/components/schemas/MediaLink'
    PriceVersion:
      type: object
      required:
      - id
      - variantId
      - currency
      - amountMinor
      - mrpMinor
      - priceState
      - validFrom
      properties:
        id:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        currency:
          type: string
          const: INR
        amountMinor:
          type: integer
          minimum: 0
        mrpMinor:
          type: integer
          minimum: 1
        priceState:
          type: string
          enum:
          - DRAFT
          - PENDING
          - APPROVED
          - REJECTED
          - EXPIRED
        validFrom:
          type: string
          format: date-time
        validTo:
          type:
          - string
          - 'null'
          format: date-time
        rowVersion:
          type: integer
          minimum: 1
    MediaLink:
      type: object
      required:
      - id
      - mediaAssetId
      - productId
      - displayRole
      - displayOrder
      - scanState
      - rightsState
      properties:
        id:
          type: string
          format: uuid
        mediaAssetId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        variantId:
          type:
          - string
          - 'null'
          format: uuid
        displayRole:
          type: string
        displayOrder:
          type: integer
          minimum: 0
        scanState:
          type: string
          enum:
